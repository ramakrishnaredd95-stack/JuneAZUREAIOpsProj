# Azure/AKS deployment of the application manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
  - aiops-assistant.yml
patches:
  # Start healthy even if the shared demo manifest is exercising a failed canary.
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: catalog-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "0"
# Azure CI rewrites these names and tags after pushing to ACR.
images:
  - name: telugu-pickles/aiops-assistant
    newName: telugupickles4cys9h.azurecr.io/telugu-pickles/aiops-assistant
    newTag: 185b263a7186008db847e894368a74b6c6534080
  - name: telugu-pickles/frontend
    newName: telugupickles4cys9h.azurecr.io/telugu-pickles/frontend
    newTag: 185b263a7186008db847e894368a74b6c6534080
  - name: telugu-pickles/gateway
    newName: telugupickles4cys9h.azurecr.io/telugu-pickles/gateway
